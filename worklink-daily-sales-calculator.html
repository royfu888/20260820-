<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>WorkLink 每日銷售收入計算器</title>
  <style>
    :root {
      --navy: #4a2b08;
      --blue: #b7791f;
      --blue-dark: #8d5a12;
      --blue-soft: #fff4cf;
      --line: #ead7a0;
      --text: #3e2a12;
      --muted: #806b4d;
      --surface: #fffdf7;
      --danger: #c33b4a;
      --shadow: 0 16px 42px rgba(14, 67, 122, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 85% 0%, rgba(217, 164, 65, .22), transparent 30rem),
        linear-gradient(180deg, #fffaf0 0%, #f7eed7 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(145deg, #e0ad45, #9b6717);
      box-shadow: 0 9px 22px rgba(155, 103, 23, .25);
      font-weight: 800;
      letter-spacing: -.04em;
    }

    h1 { margin: 0; color: var(--navy); font-size: clamp(1.45rem, 3vw, 2rem); line-height: 1.2; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: .94rem; }

    .date-wrap { width: min(100%, 210px); }
    label { display: block; margin: 0 0 7px; color: #3e5873; font-size: .82rem; font-weight: 700; }

    input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--text);
      background: #fbfdff;
      padding: 0 12px;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    input:focus { border-color: #d3a33e; background: #fff; box-shadow: 0 0 0 4px rgba(211, 163, 62, .18); }

    .card {
      overflow: hidden;
      border: 1px solid rgba(198, 216, 235, .9);
      border-radius: 18px;
      background: rgba(255, 255, 255, .96);
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 21px 24px;
      border-bottom: 1px solid var(--line);
    }
    .card-head h2 { margin: 0; color: var(--navy); font-size: 1.05rem; }
    .count { margin-left: 7px; color: var(--blue); background: var(--blue-soft); padding: 3px 8px; border-radius: 999px; font-size: .76rem; }

    .btn {
      min-height: 40px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      padding: 9px 14px;
      font-weight: 750;
      transition: transform .15s, background .15s, box-shadow .15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:focus-visible { outline: 3px solid rgba(55, 139, 226, .3); outline-offset: 2px; }
    .btn-primary { color: white; background: var(--blue); box-shadow: 0 7px 16px rgba(23, 104, 196, .2); }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-ghost { color: #597189; background: transparent; border: 1px solid var(--line); }
    .btn-ghost:hover { color: var(--danger); border-color: #efb8bf; background: #fff6f7; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { padding: 12px 12px; color: #58718a; background: #f7fbff; font-size: .76rem; text-align: left; letter-spacing: .03em; }
    td { padding: 13px 12px; border-top: 1px solid #e7eff7; vertical-align: middle; }
    tbody tr:first-child td { border-top: 0; }
    tbody tr:hover { background: #fbfdff; }
    .col-num { width: 11%; }
    .col-price { width: 20%; }
    .col-total { width: 20%; }
    .col-action { width: 76px; text-align: center; }
    .money { color: var(--navy); font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
    .delete {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 9px;
      color: #708398;
      background: transparent;
      cursor: pointer;
      font-size: 1.25rem;
    }
    .delete:hover { color: var(--danger); background: #fff0f2; }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 18px 24px;
      border-top: 1px solid var(--line);
      background: linear-gradient(90deg, #fffaf0, #fff1c9);
    }
    .summary-box { min-width: 0; padding: 4px 14px; border-left: 3px solid #d3a33e; }
    .summary-label, .period-label { color: #806b4d; font-size: .86rem; font-weight: 700; }
    .grand-total { margin-top: 5px; color: var(--navy); font-size: clamp(1.75rem, 4vw, 2.35rem); font-weight: 850; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
    .summary-note { margin-top: 3px; color: var(--muted); font-size: .77rem; }
    .period-total { margin-top: 5px; color: var(--navy); font-size: 1.35rem; font-weight: 850; font-variant-numeric: tabular-nums; }

    .footer-actions { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 16px; }
    .hint { margin: 0; color: var(--muted); font-size: .82rem; }

    @media (max-width: 720px) {
      .page { width: min(100% - 22px, 620px); padding-top: 24px; }
      .topbar { flex-direction: column; gap: 20px; }
      .date-wrap { width: 100%; }
      .card-head { padding: 17px 16px; }
      .table-wrap { overflow: visible; padding: 4px 14px 8px; }
      table, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      tbody tr { position: relative; padding: 16px 46px 15px 0; border-bottom: 1px solid var(--line); }
      tbody tr:last-child { border-bottom: 0; }
      td { border: 0; padding: 0 0 12px; }
      td::before { content: attr(data-label); display: block; margin-bottom: 6px; color: #58718a; font-size: .75rem; font-weight: 750; }
      td.col-action { position: absolute; top: 12px; right: 0; width: 40px; padding: 0; }
      td.col-action::before { display: none; }
      .money { min-height: 32px; display: flex; align-items: center; font-size: 1.05rem; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 18px; }
      .summary-box { min-width: 0; width: 100%; }
      .footer-actions { align-items: stretch; flex-direction: column; }
      .footer-actions .btn { order: -1; }
    }

    @media (max-width: 420px) {
      .summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">W</div>
        <div>
          <h1>SKS X WorkLink 每日銷售收入</h1>
          <p class="subtitle">輸入當日銷售數字，週、月、年收入即時彙總。</p>
        </div>
      </div>
      <div class="date-wrap">
        <label for="saleDate">銷售日期</label>
        <input id="saleDate" type="date">
      </div>
    </header>

    <section class="card" aria-labelledby="itemsTitle">
      <div class="card-head">
        <h2 id="itemsTitle">銷售項目 <span class="count" id="itemCount">1 筆</span></h2>
        <button class="btn btn-primary" id="addRow" type="button">＋ 新增項目</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>產品／方案名稱</th>
              <th class="col-num">數量</th>
              <th class="col-price">單價（NT$）</th>
              <th class="col-total">小計</th>
              <th class="col-action"><span class="sr-only">操作</span></th>
            </tr>
          </thead>
          <tbody id="salesBody"></tbody>
        </table>
      </div>

      <div class="summary" aria-live="polite">
        <div class="summary-box">
          <div class="summary-label">當日總收入</div>
          <div class="grand-total" id="grandTotal">NT$ 0</div>
          <div class="summary-note" id="summaryNote">共 0 件商品</div>
        </div>
        <div class="summary-box">
          <div class="period-label">本週總收入</div>
          <div class="period-total" id="weekTotal">NT$ 0</div>
        </div>
        <div class="summary-box">
          <div class="period-label">本月總收入</div>
          <div class="period-total" id="monthTotal">NT$ 0</div>
        </div>
        <div class="summary-box">
          <div class="period-label">本年總收入</div>
          <div class="period-total" id="yearTotal">NT$ 0</div>
        </div>
      </div>
    </section>

    <div class="footer-actions">
      <p class="hint">銷售數量與單價輸入後，所有收入總額會立即更新。</p>
      <button class="btn btn-ghost" id="clearAll" type="button">清空今日資料</button>
    </div>
  </main>

  <template id="rowTemplate">
    <tr>
      <td data-label="產品／方案名稱"><input class="product" type="text" placeholder="例如：WorkLink 專業版" aria-label="產品或方案名稱"></td>
      <td class="col-num" data-label="數量"><input class="quantity" type="number" inputmode="numeric" min="0" step="1" value="1" aria-label="銷售數量"></td>
      <td class="col-price" data-label="單價（NT$）"><input class="price" type="number" inputmode="decimal" min="0" step="1" placeholder="0" aria-label="單價"></td>
      <td class="col-total" data-label="小計"><span class="money subtotal">NT$ 0</span></td>
      <td class="col-action"><button class="delete" type="button" title="刪除此項" aria-label="刪除此銷售項目">×</button></td>
    </tr>
  </template>

  <script>
    (() => {
      const body = document.getElementById('salesBody');
      const template = document.getElementById('rowTemplate');
      const dateInput = document.getElementById('saleDate');
      const totalEl = document.getElementById('grandTotal');
      const noteEl = document.getElementById('summaryNote');
      const countEl = document.getElementById('itemCount');
      const weekTotalEl = document.getElementById('weekTotal');
      const monthTotalEl = document.getElementById('monthTotal');
      const yearTotalEl = document.getElementById('yearTotal');
      const formatter = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 2 });
      const storageKey = 'worklink-daily-sales';

      function todayLocal() {
        const now = new Date();
        const offset = now.getTimezoneOffset() * 60000;
        return new Date(now.getTime() - offset).toISOString().slice(0, 10);
      }

      function money(value) {
        return `NT$ ${formatter.format(value)}`;
      }

      function safeNumber(input) {
        const value = Number(input.value);
        return Number.isFinite(value) && value > 0 ? value : 0;
      }

      function readSales() {
        try { return JSON.parse(localStorage.getItem(storageKey) || '{}'); }
        catch { return {}; }
      }

      function rowsToData() {
        return [...body.querySelectorAll('tr')].map(row => ({
          product: row.querySelector('.product').value,
          quantity: safeNumber(row.querySelector('.quantity')),
          price: safeNumber(row.querySelector('.price'))
        }));
      }

      function saveSales() {
        const sales = readSales();
        sales[dateInput.value] = rowsToData();
        localStorage.setItem(storageKey, JSON.stringify(sales));
      }

      function totalForRows(rows) {
        return rows.reduce((sum, row) => sum + row.quantity * row.price, 0);
      }

      function dateFromKey(key) {
        const [year, month, day] = key.split('-').map(Number);
        return new Date(year, month - 1, day);
      }

      function updatePeriodTotals() {
        const selected = dateFromKey(dateInput.value);
        const sales = readSales();
        const startOfWeek = new Date(selected);
        const day = startOfWeek.getDay();
        startOfWeek.setDate(startOfWeek.getDate() - (day === 0 ? 6 : day - 1));
        startOfWeek.setHours(0, 0, 0, 0);
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(endOfWeek.getDate() + 7);
        const total = matches => Object.entries(sales).reduce((sum, [key, rows]) => {
          const date = dateFromKey(key);
          return matches(date) ? sum + totalForRows(rows) : sum;
        }, 0);
        weekTotalEl.textContent = money(total(date => date >= startOfWeek && date < endOfWeek));
        monthTotalEl.textContent = money(total(date => date.getFullYear() === selected.getFullYear() && date.getMonth() === selected.getMonth()));
        yearTotalEl.textContent = money(total(date => date.getFullYear() === selected.getFullYear()));
      }

      function loadSelectedDate() {
        const savedRows = readSales()[dateInput.value] || [];
        body.replaceChildren();
        (savedRows.length ? savedRows : [{}]).forEach(saved => {
          const row = template.content.firstElementChild.cloneNode(true);
          row.querySelector('.product').value = saved.product || '';
          row.querySelector('.quantity').value = saved.quantity || 1;
          row.querySelector('.price').value = saved.price || '';
          row.addEventListener('input', updateTotals);
          row.querySelector('.delete').addEventListener('click', () => {
            row.remove();
            if (!body.children.length) addRow();
            updateTotals();
          });
          body.appendChild(row);
        });
        updateTotals();
      }

      function updateTotals() {
        let total = 0;
        let units = 0;
        const rows = [...body.querySelectorAll('tr')];

        rows.forEach(row => {
          const quantity = safeNumber(row.querySelector('.quantity'));
          const price = safeNumber(row.querySelector('.price'));
          const subtotal = quantity * price;
          units += quantity;
          total += subtotal;
          row.querySelector('.subtotal').textContent = money(subtotal);
        });

        totalEl.textContent = money(total);
        noteEl.textContent = `共 ${formatter.format(units)} 件商品`;
        countEl.textContent = `${rows.length} 筆`;
        saveSales();
        updatePeriodTotals();
      }

      function addRow(focus = false) {
        const row = template.content.firstElementChild.cloneNode(true);
        row.addEventListener('input', updateTotals);
        row.querySelector('.delete').addEventListener('click', () => {
          row.remove();
          if (!body.children.length) addRow();
          updateTotals();
        });
        body.appendChild(row);
        updateTotals();
        if (focus) row.querySelector('.product').focus();
      }

      document.getElementById('addRow').addEventListener('click', () => addRow(true));
      document.getElementById('clearAll').addEventListener('click', () => {
        const hasData = [...body.querySelectorAll('input')].some(input =>
          (input.classList.contains('product') && input.value.trim()) ||
          (input.classList.contains('price') && safeNumber(input) > 0)
        );
        if (hasData && !window.confirm('確定要清空今日所有銷售資料嗎？')) return;
        body.replaceChildren();
        dateInput.value = todayLocal();
        addRow(true);
      });

      dateInput.value = todayLocal();
      loadSelectedDate();
    })();
  </script>
</body>
</html>
